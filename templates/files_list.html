{% extends "base.html" %}
{% block title %}My files{% endblock %}
{% block content %}
<h2>My files</h2>

<form method="post" enctype="multipart/form-data" class="narrow">
  <div class="field">
    <label for="file">Upload a file</label>
    <input type="file" id="file" name="file" required>
  </div>
  <p><button type="submit">Upload</button></p>
</form>

{% if files %}
  <table>
    <tr><th>Name</th><th>Kind</th><th>Uploaded</th><th></th></tr>
    {% for f in files %}
      <tr>
        <td>{{ f['label'] }}</td>
        <td>{{ f['file_kind'] }}</td>
        <td>{{ f['created_at'] }}</td>
        <td>
          <a href="{{ url_for('download_file', file_id=f['id']) }}">Download</a>
          <form method="post" action="{{ url_for('delete_file', file_id=f['id']) }}"
                onsubmit="return confirm('Delete this file?');" style="display:inline">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </table>
{% else %}
  <p class="empty">No files uploaded yet.</p>
{% endif %}
{% endblock %}
